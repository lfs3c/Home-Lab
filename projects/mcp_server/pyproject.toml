[project]
name = "lf1-mcp-server"
version = "0.1.0"
description = "Security-focused MCP server for the LF1 Home Lab"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
